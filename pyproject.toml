# Tooling configuration for the Check My Bill Home Assistant integration.
#
# Nothing here is published as a package. HACS installs the integration by
# copying custom_components/check_my_bill/ into a Home Assistant config directory,
# and the runtime dependencies that needs are declared in its manifest.json.
# This file exists to configure ruff and pytest, and to pin the dev toolchain.

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Capped at the minor: ruff enables new rules in feature releases, which
    # turns CI red on a pull request that changed nothing. Raise the cap
    # deliberately, with whatever fixes the new rules ask for.
    "ruff>=0.16,<0.17",
    "pytest-asyncio>=0.24",
]
# The Home Assistant-level tests in tests_ha/ (config flow, setup, diagnostics). Kept apart from
# `dev`: this pins an exact Home Assistant and pytest, and needs HA's Python (3.14).
# Run with `pytest -o pythonpath=. tests_ha`.
ha = [
    "pytest-homeassistant-custom-component>=0.13.366",
]

[tool.ruff]
line-length = 100
# Home Assistant 2026.8, the oldest release supported (hacs.json), requires Python 3.14.
target-version = "py314"

[tool.ruff.lint]
# Pinned explicitly. Without a select, the rule set is whatever ruff defaults to
# on the day it runs, which is how 42 findings accumulated unnoticed.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PIE",       # misc lints
    "FURB",      # refurb
    "S",         # bandit
    "BLE",       # blind except
    "PYI",       # stub/typing conventions
]

ignore = [
    # Prose in docstrings and comments uses typographic characters (x, ->)
    # deliberately; RUF001 still guards identifiers, where it matters.
    "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and use asserts by design.
"tests/*" = ["S101"]
"tests_ha/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pure billing logic (cycle math, tariff evaluation, reconciliation) lives in plain modules
# that tests import without Home Assistant installed.
pythonpath = ["custom_components/check_my_bill"]
asyncio_mode = "auto"
